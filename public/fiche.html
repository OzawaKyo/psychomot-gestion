<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fiche patient</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .fiche { max-width: 820px; margin: 0 auto; padding: 20px 16px 48px; }
    .fiche .card { padding: 22px; margin-bottom: 14px; }
    .fiche-entete { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .fiche-entete h1 { font-size: 24px; }
    .fiche .section-titre { margin-top: 0; }
    .fiche .liste > li { padding: 8px 0; }
    @media print {
      body { background: #fff; font-size: 12pt; }
      .topbar, .no-print { display: none !important; }
      .fiche { padding: 0; max-width: none; }
      .fiche .card { border: none; box-shadow: none; padding: 0 0 12pt; margin: 0 0 12pt; border-bottom: 1px solid #ddd; border-radius: 0; break-inside: avoid; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>
  <header class="topbar"><div class="brand" style="display:block">Cabinet de psychomotricité</div></header>
  <main class="fiche" id="fiche"><div class="card detail-vide">Chargement…</div></main>

  <script src="/commun.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const vide = '<span class="vide">Non renseigné</span>';

    (async () => {
      const [patients, champs, docs, demandes] = await Promise.all([
        fetch('/api/patients').then((r) => r.json()),
        fetch('/api/champs').then((r) => r.json()),
        fetch(`/api/patients/${id}/documents`).then((r) => r.json()),
        fetch(`/api/patients/${id}/demandes`).then((r) => r.json()),
      ]);
      const p = patients.find((x) => x.id === id);
      if (!p) { document.getElementById('fiche').innerHTML = '<div class="card detail-vide">Patient introuvable.</div>'; return; }
      document.title = `Fiche – ${p.prenom} ${p.nom}`;
      const details = p.details || {};
      const derniereReponse = demandes.map((d) => d.formulaireRempliAt).filter(Boolean).sort().pop();

      document.getElementById('fiche').innerHTML = `
        <div class="card">
          <div class="fiche-entete">
            <div>
              <h1>${escHtml(p.prenom)} ${escHtml(p.nom)}</h1>
              <div class="muted">Fiche du ${fmtDate(new Date())}${derniereReponse ? ` · formulaire patient rempli le ${fmtDate(derniereReponse)}` : ''}</div>
            </div>
            <button class="btn primary no-print" onclick="print()">${icone('printer', 16)}Imprimer / PDF</button>
          </div>
        </div>

        <div class="card">
          <h3 class="section-titre">Informations de base</h3>
          <dl class="details">
            <dt>Date de naissance</dt>
            <dd>${p.dateNaissance ? `${fmtDate(p.dateNaissance)} (${age(p.dateNaissance)} ans)` : vide}</dd>
            <dt>Email</dt><dd>${escHtml(p.email) || vide}</dd>
            <dt>Téléphone</dt><dd>${escHtml(p.telephone) || vide}</dd>
            ${p.notes ? `<dt>Notes</dt><dd class="pre">${escHtml(p.notes)}</dd>` : ''}
            <dt>Suivi depuis le</dt><dd>${fmtDate(p.createdAt)}</dd>
          </dl>
        </div>

        ${grouperParSection(champs).map((g) => `
          <div class="card">
            <h3 class="section-titre">${escHtml(g.titre || 'Détails')}</h3>
            <dl class="details">
              ${g.champs.map((c) => `<dt>${escHtml(c.label)}</dt><dd>${valeurAffichee(c, details[c.id])}</dd>`).join('')}
            </dl>
          </div>`).join('')}

        <div class="card">
          <h3 class="section-titre">Documents (${docs.length})</h3>
          ${docs.length ? `<ul class="liste">${docs.map((d) => `
            <li>
              <span class="doc-texte">
                <a class="doc-nom" href="/api/documents/${d.id}/fichier" target="_blank" rel="noopener">${escHtml(d.nom)}</a>
                <span class="doc-meta">${fmtDate(d.createdAt)} · ${d.source === 'patient' ? `Envoyé par le patient${d.libelle ? ' (' + escHtml(d.libelle) + ')' : ''}` : 'Ajouté par le cabinet'}</span>
              </span>
            </li>`).join('')}</ul>` : '<p class="vide">Aucun document.</p>'}
        </div>`;
    })();
  </script>
</body>
</html>
